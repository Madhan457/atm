# Server Port
server.port=8080

# Application Name
spring.application.name=bank-management

# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bank_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson DateTime Serialization
spring.jackson.serialization.write-dates-as-timestamps=false
